name: Production Drift Guard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: production-drift-guard
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Baseline lives in the Actions cache, not a commit to main — committing
      # the advancing SHA back to the production branch would trigger another
      # Vercel deploy, which would advance the baseline again next run, forever.
      - name: Restore last verified baseline
        uses: actions/cache/restore@v4
        with:
          path: .github/state
          key: production-baseline-${{ github.run_id }}
          restore-keys: |
            production-baseline-

      - name: Check production against main
        id: guard
        run: node scripts/production-drift-guard.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Save verified baseline
        if: steps.guard.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .github/state
          key: production-baseline-${{ github.run_id }}

      - name: Close resolved drift issue
        if: steps.guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label production-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Production verified healthy again at $(date -u +%FT%TZ). Closing."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi

      # Scoped to the guard step's own outcome, not job-level failure() — a
      # checkout or cache hiccup unrelated to production health must not file
      # a false "production is down" incident.
      - name: File or update regression issue
        if: always() && steps.guard.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create production-drift --color B60205 \
            --description "Automated: production failed the drift guard" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label production-drift --state open --json number --jq '.[0].number // empty')
          body="Production Drift Guard failed at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Production is not serving verified main (drift guard failed)" \
              --label production-drift --body "$body"
          fi
