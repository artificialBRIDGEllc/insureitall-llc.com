<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BRIDGEt">
  <defs>
    <linearGradient id="tile" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0%" stop-color="#1C3F73"/>
      <stop offset="42%" stop-color="#0C274C"/>
      <stop offset="100%" stop-color="#06101F"/>
    </linearGradient>
    <linearGradient id="clay" x1="0.15" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="38%" stop-color="#F4EFE6"/>
      <stop offset="78%" stop-color="#D9CBB6"/>
      <stop offset="100%" stop-color="#B9A48A"/>
    </linearGradient>
    <radialGradient id="gold" cx="34%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="38%" stop-color="#E2C04A"/>
      <stop offset="72%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#7A5810"/>
    </radialGradient>
    <filter id="tileClay" x="-12%" y="-12%" width="124%" height="136%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feSpecularLighting in="b" surfaceScale="9" specularConstant="0.85" specularExponent="18" lighting-color="#A8C8F0" result="spec">
        <fePointLight x="90" y="-30" z="200"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="SourceGraphic" in2="specClip" operator="arithmetic" k1="0" k2="1" k3="0.5" k4="0" result="lit"/>
      <feDropShadow in="lit" dx="0" dy="16" stdDeviation="14" flood-color="#020817" flood-opacity="0.42"/>
    </filter>
    <filter id="clayTube" x="-40%" y="-40%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="8" specularConstant="1.4" specularExponent="22" lighting-color="#FFFFFF" result="spec">
        <fePointLight x="-40" y="-90" z="140"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1.15" k4="0" result="lit"/>
      <feDropShadow in="lit" dx="4" dy="12" stdDeviation="7" flood-color="#020817" flood-opacity="0.55"/>
    </filter>
    <filter id="goldClay" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"/>
      <feSpecularLighting in="b" surfaceScale="6" specularConstant="1.6" specularExponent="28" lighting-color="#FFF4C8" result="spec">
        <fePointLight x="-8" y="-16" z="36"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1.05" k4="0" result="lit"/>
      <feDropShadow in="lit" dx="1" dy="5" stdDeviation="3.5" flood-color="#020817" flood-opacity="0.5"/>
    </filter>
    <style>
      .arc {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw 3.2s ease-in-out infinite;
      }
      .spark {
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(0);
        animation: bloom 3.2s ease-in-out infinite;
      }
      @keyframes draw {
        0% { stroke-dashoffset: 100; }
        20% { stroke-dashoffset: 0; }
        78% { stroke-dashoffset: 0; }
        94% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 100; }
      }
      @keyframes bloom {
        0%, 16% { transform: scale(0); opacity: 0; }
        22% { transform: scale(1.25); opacity: 1; }
        32% { transform: scale(1); opacity: 1; }
        78% { transform: scale(1); opacity: 1; }
        90%, 100% { transform: scale(0); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .arc { animation: none; stroke-dashoffset: 0; }
        .spark { animation: none; transform: scale(1); opacity: 1; }
      }
    </style>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="108" fill="url(#tile)" filter="url(#tileClay)"/>
  <g fill="none" stroke="#6B5A46" stroke-width="62" stroke-linecap="round" opacity="0.35" transform="translate(5 10)">
    <path d="M176 404 V108"/>
    <path d="M176 108 H290 C356 108 384 140 384 184 C384 226 356 254 290 254 H176"/>
    <path d="M176 254 C 322 254 386 280 396 302"/>
    <path d="M176 404 C 322 404 386 378 396 356"/>
  </g>
  <g fill="none" stroke="url(#clay)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" filter="url(#clayTube)">
    <path d="M176 404 V108"/>
    <path d="M176 108 H290 C356 108 384 140 384 184 C384 226 356 254 290 254 H176"/>
    <path class="arc" pathLength="100" d="M176 254 C 322 254 386 280 396 302"/>
    <path class="arc" pathLength="100" d="M176 404 C 322 404 386 378 396 356"/>
  </g>
  <g fill="none" stroke="#FFFDF8" stroke-width="13" stroke-linecap="round" opacity="0.38" transform="translate(-5 -7)">
    <path d="M176 404 V108"/>
    <path d="M176 108 H290 C356 108 384 140 384 184 C384 226 356 254 290 254 H176"/>
    <path class="arc" pathLength="100" d="M176 254 C 322 254 386 280 396 302"/>
    <path class="arc" pathLength="100" d="M176 404 C 322 404 386 378 396 356"/>
  </g>
  <circle class="spark" cx="396" cy="329" r="16" fill="url(#gold)" filter="url(#goldClay)"/>
</svg>
